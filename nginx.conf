server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend static files with SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to mock API service
    location /api/ {
        # Rewrite /api/v1/status to /status for json-server
        rewrite ^/api/v1/(.*)$ /$1 break;
        rewrite ^/api/auth/(.*)$ /$1 break;
        rewrite ^/api/events/(.*)$ /$1 break;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://yo3-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers for preview mode
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Health check endpoint
    location /health {
        return 200 '{"status":"healthy","service":"yo3-frontend"}';
        add_header Content-Type application/json;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
